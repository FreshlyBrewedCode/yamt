[project]
name = "yamt-stt"
version = "0.1.0"
description = "yamt speech-to-text: German voice memos with faster-whisper on the CPU, one short-lived process per batch"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
