name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The gate: Biome, strict tsc for every package and e2e, bun test; then the web build `start` serves.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # the real-ffmpeg normalisation test runs when ffmpeg is there
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run build

  # The speech-to-text process (services/stt): ruff + pytest against a stub backend, no model download.
  stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/stt/uv.lock

      - run: services/stt/run.sh check

  # One throwaway server (temp data dir, localhost, auth bypassed), the shell in Chromium.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      # the transcription spec normalises a memo with the real ffmpeg (then a fake STT process)
      - run: sudo apt-get install -y --no-install-recommends ffmpeg

      - run: bun run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
